name: Make and agent skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FIGMA_CLI_SKIP_SKILLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full offline Make, installation, and platform suite
        run: node tests/run-make-tests.mjs
      - name: Verify Node installation and Copilot registration without a shell
        run: node tests/node-install-smoke.mjs
      - run: npm pack --dry-run
